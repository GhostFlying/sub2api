name: Promote Fork

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

env:
  BASE_BRANCH: fork
  ANCHOR_BRANCH: upstream-release
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  CONFLICT_ISSUE_LABEL: sync-upstream-conflict
  REQUIRED_CHECKS: test frontend golangci-lint backend-security frontend-security

jobs:
  promote:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/promote-fork' }}
    concurrency:
      group: fork-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Validate promote request
        id: request
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          COMMAND="$(printf '%s' "${COMMENT_BODY}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${COMMAND}" != "/promote-fork" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: the promote command must be exactly \`/promote-fork\`."
            exit 1
          fi

          PERMISSION="$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENT_AUTHOR}/permission" \
            --jq .permission)"

          case "${PERMISSION}" in
            admin|maintain|write)
              ;;
            *)
              gh pr comment "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Refusing to promote: @${COMMENT_AUTHOR} has \`${PERMISSION}\` permission, but \`write\`, \`maintain\`, or \`admin\` is required."
              exit 1
              ;;
          esac

          gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json baseRefName,body,headRefName,headRefOid,state \
            > /tmp/pr.json

          STATE="$(jq -r .state /tmp/pr.json)"
          BASE_REF="$(jq -r .baseRefName /tmp/pr.json)"
          HEAD_REF="$(jq -r .headRefName /tmp/pr.json)"
          HEAD_SHA="$(jq -r .headRefOid /tmp/pr.json)"
          PR_BODY="$(jq -r .body /tmp/pr.json)"

          if [ "${STATE}" != "OPEN" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: PR #${PR_NUMBER} is ${STATE}, not OPEN."
            exit 1
          fi

          if [ "${BASE_REF}" != "${BASE_BRANCH}" ] || [[ "${HEAD_REF}" != sync/upstream-* ]]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: expected \`sync/upstream-* -> ${BASE_BRANCH}\`, got \`${HEAD_REF} -> ${BASE_REF}\`."
            exit 1
          fi

          TAG="${HEAD_REF#sync/upstream-}"
          MARKER_JSON="$(sed -n \
            's/^<!-- fork-sync-source \(.*\) -->$/\1/p' \
            <<<"${PR_BODY}" |
          tail -n 1)"
          if ! jq -e \
            --arg tag "${TAG}" \
            --arg head_sha "${HEAD_SHA}" \
            '
              .version == 1 and
              .tag == $tag and
              (.base_sha | test("^[0-9a-f]{40}$")) and
              (.anchor_sha | test("^[0-9a-f]{40}$")) and
              (.effective_base_sha | test("^[0-9a-f]{40}$")) and
              .head_sha == $head_sha
            ' <<<"${MARKER_JSON}" >/dev/null 2>&1; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: the preview source-ref marker is missing or does not match the reviewed head. Re-run the sync workflow and review the regenerated preview."
            exit 1
          fi

          SOURCE_BASE_SHA="$(jq -r .base_sha <<<"${MARKER_JSON}")"
          SOURCE_ANCHOR_SHA="$(jq -r .anchor_sha <<<"${MARKER_JSON}")"
          SOURCE_EFFECTIVE_BASE_SHA="$(jq -r .effective_base_sha <<<"${MARKER_JSON}")"

          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[] | {name,status,conclusion,html_url,started_at,completed_at}' \
            > /tmp/check-runs.jsonl

          MISSING_CHECKS=""
          BAD_CHECKS=""
          for REQUIRED_CHECK in ${REQUIRED_CHECKS}; do
            CHECK_JSON="$(jq -s --arg name "${REQUIRED_CHECK}" '
              map(select(.name == $name))
              | sort_by(.started_at // .completed_at // "")
              | last // empty
            ' /tmp/check-runs.jsonl)"

            if [ -z "${CHECK_JSON}" ]; then
              MISSING_CHECKS="${MISSING_CHECKS}"$'\n'"- ${REQUIRED_CHECK}: missing"
              continue
            fi

            STATUS="$(jq -r '.status // "unknown"' <<<"${CHECK_JSON}")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"${CHECK_JSON}")"
            URL="$(jq -r '.html_url // ""' <<<"${CHECK_JSON}")"

            if [ "${STATUS}" != "completed" ] || { [ "${CONCLUSION}" != "success" ] && [ "${CONCLUSION}" != "neutral" ] && [ "${CONCLUSION}" != "skipped" ]; }; then
              BAD_CHECKS="${BAD_CHECKS}"$'\n'"- ${REQUIRED_CHECK}: ${STATUS} ${CONCLUSION} ${URL}"
            fi
          done

          if [ -n "${MISSING_CHECKS}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: required checks have not reported yet.${MISSING_CHECKS}"
            exit 1
          fi

          if [ -n "${BAD_CHECKS}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: required checks are not all passing yet.${BAD_CHECKS}"
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_base_sha=${SOURCE_BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "source_anchor_sha=${SOURCE_ANCHOR_SHA}" >> "${GITHUB_OUTPUT}"
          echo "source_effective_base_sha=${SOURCE_EFFECTIVE_BASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_MAINTENANCE_TOKEN }}

      - name: Promote generated fork
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_REF: ${{ steps.request.outputs.head_ref }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          TAG: ${{ steps.request.outputs.tag }}
          SOURCE_BASE_SHA: ${{ steps.request.outputs.source_base_sha }}
          SOURCE_ANCHOR_SHA: ${{ steps.request.outputs.source_anchor_sha }}
          SOURCE_EFFECTIVE_BASE_SHA: ${{ steps.request.outputs.source_effective_base_sha }}
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream --tags --force \
            "+refs/heads/main:refs/remotes/upstream/main"
          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          VERSION="${TAG#v}"
          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          EFFECTIVE_BASE_SHA="${TAG_SHA}"
          VERSION_SYNC_SHA=""
          REMOTE_BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"
          REMOTE_ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"
          REMOTE_HEAD_SHA="$(git rev-parse "origin/${HEAD_REF}^{commit}")"

          while IFS= read -r CANDIDATE; do
            SUBJECT="$(git log -1 --format=%s "${CANDIDATE}")"
            if [ "${SUBJECT}" != "chore: sync VERSION to ${VERSION} [skip ci]" ]; then
              continue
            fi

            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${CANDIDATE}")"
            if [ "${CHANGED_FILES}" != "backend/cmd/server/VERSION" ]; then
              continue
            fi

            VERSION_FILE="$(git show "${CANDIDATE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
            if [ "${VERSION_FILE}" != "${VERSION}" ]; then
              continue
            fi

            VERSION_SYNC_SHA="${CANDIDATE}"
            EFFECTIVE_BASE_SHA="${CANDIDATE}"
            break
          done < <(git rev-list --reverse "${TAG_SHA}..upstream/main" -- backend/cmd/server/VERSION)

          if [ "${REMOTE_HEAD_SHA}" != "${HEAD_SHA}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: \`${HEAD_REF}\` moved from \`${HEAD_SHA}\` to \`${REMOTE_HEAD_SHA}\`. Re-run the sync workflow and review the new preview."
            exit 1
          fi

          if [ "${REMOTE_BASE_SHA}" != "${SOURCE_BASE_SHA}" ] ||
            [ "${REMOTE_ANCHOR_SHA}" != "${SOURCE_ANCHOR_SHA}" ] ||
            [ "${EFFECTIVE_BASE_SHA}" != "${SOURCE_EFFECTIVE_BASE_SHA}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: the preview was generated from stale fork-maintenance refs or a different effective baseline. Re-run the sync workflow and review the regenerated preview."
            echo "Preview ${BASE_BRANCH}: ${SOURCE_BASE_SHA}; current: ${REMOTE_BASE_SHA}"
            echo "Preview ${ANCHOR_BRANCH}: ${SOURCE_ANCHOR_SHA}; current: ${REMOTE_ANCHOR_SHA}"
            echo "Preview effective baseline: ${SOURCE_EFFECTIVE_BASE_SHA}; current: ${EFFECTIVE_BASE_SHA}"
            exit 1
          fi

          git push --atomic \
            --force-with-lease="refs/heads/${BASE_BRANCH}:${SOURCE_BASE_SHA}" \
            --force-with-lease="refs/heads/${ANCHOR_BRANCH}:${SOURCE_ANCHOR_SHA}" \
            --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin \
            "${HEAD_SHA}:refs/heads/${BASE_BRANCH}" \
            "${EFFECTIVE_BASE_SHA}:refs/heads/${ANCHOR_BRANCH}" \
            "${HEAD_SHA}:refs/heads/${HEAD_REF}"

          if [ -n "${VERSION_SYNC_SHA}" ]; then
            ANCHOR_DESCRIPTION="effective baseline \`${EFFECTIVE_BASE_SHA}\` for \`${TAG}\`, including upstream VERSION sync commit \`${VERSION_SYNC_SHA}\`"
          else
            ANCHOR_DESCRIPTION="\`${TAG}\` (\`${TAG_SHA}\`)"
          fi

          gh workflow run "Docker Image" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASE_BRANCH}"

          if ISSUE_NUMBERS="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "${CONFLICT_ISSUE_LABEL}" \
            --state open \
            --json number,title |
          jq -r --arg title "Upstream sync conflict: ${TAG}" \
            '.[] | select(.title == $title) | .number')"; then
            while IFS= read -r ISSUE_NUMBER; do
              if [ -z "${ISSUE_NUMBER}" ]; then
                continue
              fi

              if ! gh issue close "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Promoted ${TAG} to \`${BASE_BRANCH}\`; closing this stale conflict report."; then
                echo "::warning::Failed to close stale conflict issue #${ISSUE_NUMBER} after promotion."
              fi
            done <<<"${ISSUE_NUMBERS}"
          else
            echo "::warning::Failed to list stale conflict issues after promotion."
          fi

          PROMOTE_COMMENT="Promoted \`${HEAD_REF}\` to \`${BASE_BRANCH}\` at \`${HEAD_SHA}\` and moved \`${ANCHOR_BRANCH}\` to ${ANCHOR_DESCRIPTION}. Docker publishing has been dispatched from the updated \`${BASE_BRANCH}\` branch."
          PR_STATE="$(gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json state \
            --jq .state || echo UNKNOWN)"

          if [ "${PR_STATE}" = "OPEN" ]; then
            gh pr close "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "${PROMOTE_COMMENT}" || \
              gh pr comment "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "${PROMOTE_COMMENT}" || true
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "${PROMOTE_COMMENT}" || true
          fi

          git push origin ":refs/heads/${HEAD_REF}" || true

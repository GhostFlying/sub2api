name: Promote Fork

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: promote-fork-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  BASE_BRANCH: fork
  ANCHOR_BRANCH: upstream-release
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  REQUIRED_CHECKS: test frontend golangci-lint backend-security frontend-security

jobs:
  promote:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/promote-fork') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate promote request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          COMMAND="$(printf '%s' "${COMMENT_BODY}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${COMMAND}" != "/promote-fork" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: the promote command must be exactly \`/promote-fork\`."
            exit 1
          fi

          PERMISSION="$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENT_AUTHOR}/permission" \
            --jq .permission)"

          case "${PERMISSION}" in
            admin|maintain|write)
              ;;
            *)
              gh pr comment "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Refusing to promote: @${COMMENT_AUTHOR} has \`${PERMISSION}\` permission, but \`write\`, \`maintain\`, or \`admin\` is required."
              exit 1
              ;;
          esac

          gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json number,state,baseRefName,baseRefOid,headRefName,headRefOid \
            > /tmp/pr.json

          STATE="$(jq -r .state /tmp/pr.json)"
          BASE_REF="$(jq -r .baseRefName /tmp/pr.json)"
          HEAD_REF="$(jq -r .headRefName /tmp/pr.json)"
          HEAD_SHA="$(jq -r .headRefOid /tmp/pr.json)"

          if [ "${STATE}" != "OPEN" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: PR #${PR_NUMBER} is ${STATE}, not OPEN."
            exit 1
          fi

          if [ "${BASE_REF}" != "${BASE_BRANCH}" ] || [[ "${HEAD_REF}" != sync/upstream-* ]]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: expected \`sync/upstream-* -> ${BASE_BRANCH}\`, got \`${HEAD_REF} -> ${BASE_REF}\`."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[] | {name,status,conclusion,html_url,started_at,completed_at}' \
            > /tmp/check-runs.jsonl

          MISSING_CHECKS=""
          BAD_CHECKS=""
          for REQUIRED_CHECK in ${REQUIRED_CHECKS}; do
            CHECK_JSON="$(jq -s --arg name "${REQUIRED_CHECK}" '
              map(select(.name == $name))
              | sort_by(.started_at // .completed_at // "")
              | last // empty
            ' /tmp/check-runs.jsonl)"

            if [ -z "${CHECK_JSON}" ]; then
              MISSING_CHECKS="${MISSING_CHECKS}"$'\n'"- ${REQUIRED_CHECK}: missing"
              continue
            fi

            STATUS="$(jq -r '.status // "unknown"' <<<"${CHECK_JSON}")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"${CHECK_JSON}")"
            URL="$(jq -r '.html_url // ""' <<<"${CHECK_JSON}")"

            if [ "${STATUS}" != "completed" ] || { [ "${CONCLUSION}" != "success" ] && [ "${CONCLUSION}" != "neutral" ] && [ "${CONCLUSION}" != "skipped" ]; }; then
              BAD_CHECKS="${BAD_CHECKS}"$'\n'"- ${REQUIRED_CHECK}: ${STATUS} ${CONCLUSION} ${URL}"
            fi
          done

          if [ -n "${MISSING_CHECKS}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: required checks have not reported yet.${MISSING_CHECKS}"
            exit 1
          fi

          if [ -n "${BAD_CHECKS}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: required checks are not all passing yet.${BAD_CHECKS}"
            exit 1
          fi

          TAG="${HEAD_REF#sync/upstream-}"
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Promote generated fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_REF: ${{ steps.request.outputs.head_ref }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream --tags --force \
            "+refs/heads/main:refs/remotes/upstream/main"
          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          VERSION="${TAG#v}"
          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          EFFECTIVE_BASE_SHA="${TAG_SHA}"
          VERSION_SYNC_SHA=""
          REMOTE_BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"
          REMOTE_ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"
          REMOTE_HEAD_SHA="$(git rev-parse "origin/${HEAD_REF}^{commit}")"

          while IFS= read -r CANDIDATE; do
            SUBJECT="$(git log -1 --format=%s "${CANDIDATE}")"
            if [ "${SUBJECT}" != "chore: sync VERSION to ${VERSION} [skip ci]" ]; then
              continue
            fi

            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${CANDIDATE}")"
            if [ "${CHANGED_FILES}" != "backend/cmd/server/VERSION" ]; then
              continue
            fi

            VERSION_FILE="$(git show "${CANDIDATE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
            if [ "${VERSION_FILE}" != "${VERSION}" ]; then
              continue
            fi

            VERSION_SYNC_SHA="${CANDIDATE}"
            EFFECTIVE_BASE_SHA="${CANDIDATE}"
            break
          done < <(git rev-list --reverse "${TAG_SHA}..upstream/main" -- backend/cmd/server/VERSION)

          if [ "${REMOTE_HEAD_SHA}" != "${HEAD_SHA}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: \`${HEAD_REF}\` moved from \`${HEAD_SHA}\` to \`${REMOTE_HEAD_SHA}\`. Re-run the sync workflow and review the new preview."
            exit 1
          fi

          git push --atomic \
            --force-with-lease="refs/heads/${BASE_BRANCH}:${REMOTE_BASE_SHA}" \
            --force-with-lease="refs/heads/${ANCHOR_BRANCH}:${REMOTE_ANCHOR_SHA}" \
            origin \
            "${HEAD_SHA}:refs/heads/${BASE_BRANCH}" \
            "${EFFECTIVE_BASE_SHA}:refs/heads/${ANCHOR_BRANCH}"

          if [ -n "${VERSION_SYNC_SHA}" ]; then
            ANCHOR_DESCRIPTION="effective baseline \`${EFFECTIVE_BASE_SHA}\` for \`${TAG}\`, including upstream VERSION sync commit \`${VERSION_SYNC_SHA}\`"
          else
            ANCHOR_DESCRIPTION="\`${TAG}\` (\`${TAG_SHA}\`)"
          fi

          gh pr close "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --comment "Promoted \`${HEAD_REF}\` to \`${BASE_BRANCH}\` at \`${HEAD_SHA}\` and moved \`${ANCHOR_BRANCH}\` to ${ANCHOR_DESCRIPTION}. Docker publishing will run from the updated \`${BASE_BRANCH}\` branch."

          git push origin ":refs/heads/${HEAD_REF}" || true
          gh workflow run "Docker Image" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASE_BRANCH}"

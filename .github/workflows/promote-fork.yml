name: Promote Fork

on:
  workflow_run:
    workflows: [CI, Security Scan]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate PR number to retry; normally dispatched automatically by sync.'
        required: true
        type: string
      expected_head:
        description: 'Optional exact candidate SHA captured by sync.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: read

env:
  BASE_BRANCH: fork
  ANCHOR_BRANCH: upstream-release
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  CONFLICT_ISSUE_LABEL: sync-upstream-conflict
  REQUIRED_CHECKS: test frontend golangci-lint fork-maintenance backend-security frontend-security

jobs:
  promote:
    if: >-
      github.repository == 'GhostFlying/sub2api' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fork') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'sync/upstream-') &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    concurrency:
      group: fork-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_MAINTENANCE_TOKEN }}

      - name: Validate automatic promotion
        id: request
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha || inputs.expected_head }}
        run: |
          set -euo pipefail

          PR_NUMBER="${INPUT_PR_NUMBER}"
          if [ -z "${PR_NUMBER}" ]; then
            PR_NUMBER="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${EVENT_HEAD_REF}" \
              --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "No open candidate remains for this completed run."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          HEAD_SHA="$(jq -r .head.sha /tmp/pr.json)"
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --paginate --jq '.check_runs[]' > /tmp/check-runs.jsonl
          python .github/scripts/fork_promotion.py inspect \
            --pr /tmp/pr.json --checks /tmp/check-runs.jsonl \
            --repository "${GITHUB_REPOSITORY}" \
            --required-checks "${REQUIRED_CHECKS}" \
            --expected-head "${EXPECTED_HEAD}" | tee /tmp/fork-promotion-result.json
          {
            echo '### Automatic fork promotion'
            echo '```json'
            cat /tmp/fork-promotion-result.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report failed candidate checks
        if: steps.request.outputs.result == 'blocked'
        run: |
          echo "::error::Required candidate checks failed; production refs are unchanged."
          exit 1

      - name: Promote generated fork
        if: steps.request.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_REF: ${{ steps.request.outputs.head_ref }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          TAG: ${{ steps.request.outputs.tag }}
          SOURCE_BASE_SHA: ${{ steps.request.outputs.source_base_sha }}
          SOURCE_ANCHOR_SHA: ${{ steps.request.outputs.source_anchor_sha }}
          SOURCE_EFFECTIVE_BASE_SHA: ${{ steps.request.outputs.source_effective_base_sha }}
          SOURCE_TAG_SHA: ${{ steps.request.outputs.source_tag_sha }}
        run: |
          set -euo pipefail

          gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.' > /tmp/promotion-release.jsonl
          SELECTED_TAG="$(python .github/scripts/fork_promotion.py select-release \
            --releases /tmp/promotion-release.jsonl --requested "${TAG}")"
          test "${SELECTED_TAG}" = "${TAG}"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream --tags --force \
            "+refs/heads/main:refs/remotes/upstream/main"
          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          VERSION="${TAG#v}"
          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          if [ "${TAG_SHA}" != "${SOURCE_TAG_SHA}" ]; then
            echo "::error::The upstream release tag changed after candidate generation."
            exit 1
          fi
          EFFECTIVE_BASE_SHA="${TAG_SHA}"
          VERSION_SYNC_SHA=""
          REMOTE_BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"
          REMOTE_ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"
          REMOTE_HEAD_SHA="$(git rev-parse "origin/${HEAD_REF}^{commit}")"

          while IFS= read -r CANDIDATE; do
            if ! git merge-base --is-ancestor "${TAG_SHA}" "${CANDIDATE}"; then
              continue
            fi
            SUBJECT="$(git log -1 --format=%s "${CANDIDATE}")"
            if [ "${SUBJECT}" != "chore: sync VERSION to ${VERSION} [skip ci]" ]; then
              continue
            fi

            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${CANDIDATE}")"
            if [ "${CHANGED_FILES}" != "backend/cmd/server/VERSION" ]; then
              continue
            fi

            VERSION_FILE="$(git show "${CANDIDATE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
            if [ "${VERSION_FILE}" != "${VERSION}" ]; then
              continue
            fi

            VERSION_SYNC_SHA="${CANDIDATE}"
            EFFECTIVE_BASE_SHA="${CANDIDATE}"
            break
          done < <(git rev-list --reverse "${TAG_SHA}..upstream/main" -- backend/cmd/server/VERSION)

          if [ "${REMOTE_HEAD_SHA}" != "${HEAD_SHA}" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Refusing to promote: \`${HEAD_REF}\` moved from \`${HEAD_SHA}\` to \`${REMOTE_HEAD_SHA}\`. Re-run the sync workflow and review the new preview."
            exit 1
          fi

          if [ "${EFFECTIVE_BASE_SHA}" != "${SOURCE_EFFECTIVE_BASE_SHA}" ] ||
            ! git merge-base --is-ancestor "${EFFECTIVE_BASE_SHA}" "origin/${HEAD_REF}"; then
            echo "::error::Candidate effective baseline changed or is not its ancestor."
            exit 1
          fi

          if [ "${REMOTE_BASE_SHA}" = "${HEAD_SHA}" ] &&
            [ "${REMOTE_ANCHOR_SHA}" = "${EFFECTIVE_BASE_SHA}" ]; then
            echo "Candidate already promoted; completing cleanup without updating refs."
          else
            if [ "${REMOTE_BASE_SHA}" != "${SOURCE_BASE_SHA}" ] ||
              [ "${REMOTE_ANCHOR_SHA}" != "${SOURCE_ANCHOR_SHA}" ]; then
              echo "::error::Candidate source refs are stale; waiting for sync to regenerate it."
              exit 1
            fi

            git push --atomic \
              --force-with-lease="refs/heads/${BASE_BRANCH}:${SOURCE_BASE_SHA}" \
              --force-with-lease="refs/heads/${ANCHOR_BRANCH}:${SOURCE_ANCHOR_SHA}" \
              --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
              origin \
              "${HEAD_SHA}:refs/heads/${BASE_BRANCH}" \
              "${EFFECTIVE_BASE_SHA}:refs/heads/${ANCHOR_BRANCH}" \
              "${HEAD_SHA}:refs/heads/${HEAD_REF}"
          fi

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}"
          test "$(git rev-parse "origin/${BASE_BRANCH}")" = "${HEAD_SHA}"
          test "$(git rev-parse "origin/${ANCHOR_BRANCH}")" = "${EFFECTIVE_BASE_SHA}"

          if [ -n "${VERSION_SYNC_SHA}" ]; then
            ANCHOR_DESCRIPTION="effective baseline \`${EFFECTIVE_BASE_SHA}\` for \`${TAG}\`, including upstream VERSION sync commit \`${VERSION_SYNC_SHA}\`"
          else
            ANCHOR_DESCRIPTION="\`${TAG}\` (\`${TAG_SHA}\`)"
          fi

          if ISSUE_NUMBERS="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "${CONFLICT_ISSUE_LABEL}" \
            --state open \
            --json number,title |
          jq -r --arg title "Upstream sync conflict: ${TAG}" \
            '.[] | select(.title == $title) | .number')"; then
            while IFS= read -r ISSUE_NUMBER; do
              if [ -z "${ISSUE_NUMBER}" ]; then
                continue
              fi

              if ! gh issue close "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Promoted ${TAG} to \`${BASE_BRANCH}\`; closing this stale conflict report."; then
                echo "::warning::Failed to close stale conflict issue #${ISSUE_NUMBER} after promotion."
              fi
            done <<<"${ISSUE_NUMBERS}"
          else
            echo "::warning::Failed to list stale conflict issues after promotion."
          fi

          PROMOTE_COMMENT="Promoted \`${HEAD_REF}\` to \`${BASE_BRANCH}\` at \`${HEAD_SHA}\` and moved \`${ANCHOR_BRANCH}\` to ${ANCHOR_DESCRIPTION}. The \`${BASE_BRANCH}\` push triggers Docker publishing."
          PR_STATE="$(gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json state \
            --jq .state || echo UNKNOWN)"

          if [ "${PR_STATE}" = "OPEN" ]; then
            gh pr close "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "${PROMOTE_COMMENT}" || \
              gh pr comment "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "${PROMOTE_COMMENT}" || true
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "${PROMOTE_COMMENT}" || true
          fi

          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin ":refs/heads/${HEAD_REF}" || true

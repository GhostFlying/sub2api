name: Sync Upstream Release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to sync, for example v0.1.133. Defaults to latest release.'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  BASE_BRANCH: fork
  ANCHOR_BRANCH: upstream-release
  CONFLICT_ISSUE_LABEL: sync-upstream-conflict

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(gh release view --repo "${UPSTREAM_REPOSITORY}" --json tagName --jq .tagName)"
          fi

          if [ -z "${TAG}" ]; then
            echo "No upstream release tag found"
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "${TAG}" | sed 's/[^A-Za-z0-9._-]/-/g')"
          BRANCH="sync/upstream-${SAFE_TAG}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_MAINTENANCE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "$(git log -1 --format=%cn HEAD)"
          git config user.email "$(git log -1 --format=%ce HEAD)"

      - name: Fetch upstream and fork refs
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream --tags --force \
            "+refs/heads/main:refs/remotes/upstream/main"
          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}"
          git fetch origin \
            "+refs/heads/sync/upstream-*:refs/remotes/origin/sync/upstream-*" || true

      - name: Resolve sync state
        id: state
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          EFFECTIVE_BASE_SHA="${TAG_SHA}"
          VERSION_SYNC_SHA=""
          ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"
          BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"

          while IFS= read -r CANDIDATE; do
            SUBJECT="$(git log -1 --format=%s "${CANDIDATE}")"
            if [ "${SUBJECT}" != "chore: sync VERSION to ${VERSION} [skip ci]" ]; then
              continue
            fi

            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${CANDIDATE}")"
            if [ "${CHANGED_FILES}" != "backend/cmd/server/VERSION" ]; then
              continue
            fi

            VERSION_FILE="$(git show "${CANDIDATE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
            if [ "${VERSION_FILE}" != "${VERSION}" ]; then
              continue
            fi

            VERSION_SYNC_SHA="${CANDIDATE}"
            EFFECTIVE_BASE_SHA="${CANDIDATE}"
            break
          done < <(git rev-list --reverse "${TAG_SHA}..upstream/main" -- backend/cmd/server/VERSION)

          echo "tag_sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"
          echo "effective_base_sha=${EFFECTIVE_BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version_sync_sha=${VERSION_SYNC_SHA}" >> "${GITHUB_OUTPUT}"
          echo "anchor_sha=${ANCHOR_SHA}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"

          if [ -n "${VERSION_SYNC_SHA}" ]; then
            echo "Using upstream VERSION sync baseline ${VERSION_SYNC_SHA} for ${TAG}."
          fi

          if [ "${ANCHOR_SHA}" = "${EFFECTIVE_BASE_SHA}" ]; then
            echo "Upstream ${TAG} is already the ${ANCHOR_BRANCH} baseline."
            echo "already_current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_current=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve active sync preview
        if: ${{ steps.state.outputs.already_current != 'true' }}
        id: preview
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          ANCHOR_SHA: ${{ steps.state.outputs.anchor_sha }}
          EFFECTIVE_BASE_SHA: ${{ steps.state.outputs.effective_base_sha }}
        run: |
          set -euo pipefail

          PREVIEW_SHA="$(git rev-parse --verify "origin/${BRANCH}^{commit}" 2>/dev/null || true)"
          if [ -z "${PREVIEW_SHA}" ]; then
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PR_NUMBER="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "${PR_NUMBER}" ]; then
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json baseRefOid,body,headRefOid \
            > /tmp/active-sync-preview.json
          PR_BASE_SHA="$(jq -r .baseRefOid /tmp/active-sync-preview.json)"
          PR_HEAD_SHA="$(jq -r .headRefOid /tmp/active-sync-preview.json)"
          PR_BODY="$(jq -r .body /tmp/active-sync-preview.json)"
          MARKER_JSON="$(sed -n \
            's/^<!-- fork-sync-source \(.*\) -->$/\1/p' \
            <<<"${PR_BODY}" |
          tail -n 1)"

          if [ "${PR_BASE_SHA}" != "${BASE_SHA}" ] ||
            [ "${PR_HEAD_SHA}" != "${PREVIEW_SHA}" ] ||
            ! jq -e \
              --arg tag "${TAG}" \
              --arg base_sha "${BASE_SHA}" \
              --arg anchor_sha "${ANCHOR_SHA}" \
              --arg effective_base_sha "${EFFECTIVE_BASE_SHA}" \
              --arg head_sha "${PREVIEW_SHA}" \
              '
                .version == 1 and
                .tag == $tag and
                .base_sha == $base_sha and
                .anchor_sha == $anchor_sha and
                .effective_base_sha == $effective_base_sha and
                .head_sha == $head_sha
              ' <<<"${MARKER_JSON}" >/dev/null 2>&1 ||
            ! git merge-base --is-ancestor "${EFFECTIVE_BASE_SHA}" "${PREVIEW_SHA}"; then
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Active preview PR #${PR_NUMBER} already covers ${BRANCH} at ${PREVIEW_SHA}."
          echo "active=true" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${PREVIEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go for generated conflict recovery
        if: ${{ steps.state.outputs.already_current != 'true' && steps.preview.outputs.active != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Close stale sync previews
        if: ${{ steps.state.outputs.already_current != 'true' && steps.preview.outputs.active != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          CURRENT_BRANCH: ${{ steps.release.outputs.branch }}
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | [.number, .headRefName] | @tsv' |
          while IFS=$'\t' read -r PR_NUMBER HEAD_BRANCH; do
            if [ -z "${PR_NUMBER}" ] || [ "${HEAD_BRANCH}" = "${CURRENT_BRANCH}" ]; then
              continue
            fi

            gh pr close "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "Closing this preview because upstream ${CURRENT_TAG} has superseded it. A new clean preview will be generated from ${CURRENT_BRANCH}."
            git push origin ":refs/heads/${HEAD_BRANCH}" || true
          done

      - name: Replay fork patch stack
        if: ${{ steps.state.outputs.already_current != 'true' && steps.preview.outputs.active != 'true' }}
        id: replay
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          BRANCH="${{ steps.release.outputs.branch }}"
          EFFECTIVE_BASE_SHA="${{ steps.state.outputs.effective_base_sha }}"
          PATCH_STACK="/tmp/fork-patch-stack.txt"

          git rev-list --reverse "origin/${ANCHOR_BRANCH}..origin/${BASE_BRANCH}" > "${PATCH_STACK}"
          PATCH_COUNT="$(wc -l < "${PATCH_STACK}" | tr -d ' ')"
          echo "patch_count=${PATCH_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "patch_stack=${PATCH_STACK}" >> "${GITHUB_OUTPUT}"

          git checkout -B "${BRANCH}" "${EFFECTIVE_BASE_SHA}"

          FAILED_COMMIT=""
          while IFS= read -r COMMIT; do
            if [ -z "${COMMIT}" ]; then
              continue
            fi

            echo "::group::Cherry-pick ${COMMIT}"
            if git cherry-pick --empty=drop "${COMMIT}"; then
              echo "::endgroup::"
              continue
            fi

            CONFLICTED_FILES="$(git diff --name-only --diff-filter=U)"
            if [ "${CONFLICTED_FILES}" = "backend/cmd/server/wire_gen.go" ]; then
              echo "Only the generated Wire file conflicts; regenerating it from merged providers."
              if (
                cd backend
                go generate ./cmd/server
              ); then
                git add backend/cmd/server/wire_gen.go
                if git diff --cached --check &&
                  GIT_EDITOR=true git cherry-pick --continue; then
                  echo "::endgroup::"
                  continue
                fi
              fi
            fi

            FAILED_COMMIT="${COMMIT}"
            git cherry-pick --abort || true
            echo "::endgroup::"
            break
          done < "${PATCH_STACK}"

          if [ -n "${FAILED_COMMIT}" ]; then
            echo "result=conflict" >> "${GITHUB_OUTPUT}"
            echo "failed_commit=${FAILED_COMMIT}" >> "${GITHUB_OUTPUT}"
            echo "failed_subject=$(git log -1 --format=%s "${FAILED_COMMIT}")" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "result=success" >> "${GITHUB_OUTPUT}"
          echo "head_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create or update conflict issue
        if: ${{ steps.replay.outputs.result == 'conflict' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          EFFECTIVE_BASE_SHA: ${{ steps.state.outputs.effective_base_sha }}
          VERSION_SYNC_SHA: ${{ steps.state.outputs.version_sync_sha }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          ANCHOR_SHA: ${{ steps.state.outputs.anchor_sha }}
          FAILED_COMMIT: ${{ steps.replay.outputs.failed_commit }}
          FAILED_SUBJECT: ${{ steps.replay.outputs.failed_subject }}
          PATCH_STACK: ${{ steps.replay.outputs.patch_stack }}
        run: |
          set -euo pipefail

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}"
          CURRENT_BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"
          CURRENT_ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"

          if [ "${CURRENT_BASE_SHA}" != "${BASE_SHA}" ] ||
            [ "${CURRENT_ANCHOR_SHA}" != "${ANCHOR_SHA}" ]; then
            echo "::notice::Skipping stale conflict result because fork maintenance refs moved during this run."
            echo "Original ${BASE_BRANCH}: ${BASE_SHA}; current: ${CURRENT_BASE_SHA}"
            echo "Original ${ANCHOR_BRANCH}: ${ANCHOR_SHA}; current: ${CURRENT_ANCHOR_SHA}"
            exit 0
          fi

          gh label create "${CONFLICT_ISSUE_LABEL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --color B60205 \
            --description "Upstream release sync needs manual conflict resolution" || true

          BODY_FILE="$(mktemp)"
          {
            echo "Automated upstream release sync failed while replaying the fork patch stack."
            echo
            echo "- Upstream tag: \`${TAG}\`"
            echo "- Effective upstream baseline: \`${EFFECTIVE_BASE_SHA}\`"
            if [ -n "${VERSION_SYNC_SHA}" ]; then
              echo "- Upstream VERSION sync commit: \`${VERSION_SYNC_SHA}\`"
            fi
            echo "- Baseline branch: \`${ANCHOR_BRANCH}\`"
            echo "- Fork branch: \`${BASE_BRANCH}\`"
            echo "- Failed commit: \`${FAILED_COMMIT}\` ${FAILED_SUBJECT}"
            echo
            echo "Patch stack:"
            if [ -s "${PATCH_STACK}" ]; then
              while IFS= read -r COMMIT; do
                echo "- \`${COMMIT}\` $(git log -1 --format=%s "${COMMIT}")"
              done < "${PATCH_STACK}"
            else
              echo "- No fork-only commits were found."
            fi
            echo
            echo "Manual handling:"
            echo "1. Create a local branch from \`${EFFECTIVE_BASE_SHA}\`."
            echo "2. Cherry-pick \`${ANCHOR_BRANCH}..${BASE_BRANCH}\` in order."
            echo "3. Resolve conflicts and push a replacement \`sync/upstream-${TAG}\` preview branch."
            echo "4. Keep \`${BASE_BRANCH}\` unchanged until a reviewed \`/promote-fork\` succeeds."
          } > "${BODY_FILE}"

          ISSUE_JSON="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "${CONFLICT_ISSUE_LABEL}" \
            --state all \
            --limit 100 \
            --json number,state,title |
          jq -c --arg title "Upstream sync conflict: ${TAG}" \
            '[.[] | select(.title == $title)] | sort_by(.number) | last // empty')"
          ISSUE_NUMBER="$(jq -r '.number // empty' <<<"${ISSUE_JSON}")"
          ISSUE_STATE="$(jq -r '.state // empty' <<<"${ISSUE_JSON}")"

          if [ -n "${ISSUE_NUMBER}" ]; then
            if [ "${ISSUE_STATE}" = "CLOSED" ]; then
              gh issue reopen "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue edit "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Upstream sync conflict: ${TAG}" \
              --body-file "${BODY_FILE}"
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Sync for ${TAG} still conflicts at \`${FAILED_COMMIT}\`."
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Upstream sync conflict: ${TAG}" \
              --label "${CONFLICT_ISSUE_LABEL}" \
              --body-file "${BODY_FILE}"
          fi

          exit 1

      - name: Push sync branch
        if: ${{ steps.replay.outputs.result == 'success' }}
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          ANCHOR_SHA: ${{ steps.state.outputs.anchor_sha }}
        run: |
          set -euo pipefail

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${ANCHOR_BRANCH}:refs/remotes/origin/${ANCHOR_BRANCH}"
          CURRENT_BASE_SHA="$(git rev-parse "origin/${BASE_BRANCH}^{commit}")"
          CURRENT_ANCHOR_SHA="$(git rev-parse "origin/${ANCHOR_BRANCH}^{commit}")"

          if [ "${CURRENT_BASE_SHA}" != "${BASE_SHA}" ] ||
            [ "${CURRENT_ANCHOR_SHA}" != "${ANCHOR_SHA}" ]; then
            echo "::error::Fork maintenance refs moved during replay; refusing to publish a stale preview."
            echo "Original ${BASE_BRANCH}: ${BASE_SHA}; current: ${CURRENT_BASE_SHA}"
            echo "Original ${ANCHOR_BRANCH}: ${ANCHOR_SHA}; current: ${CURRENT_ANCHOR_SHA}"
            exit 1
          fi

          CURRENT_PREVIEW_SHA="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ -n "${CURRENT_PREVIEW_SHA}" ]; then
            PREVIEW_LEASE="--force-with-lease=refs/heads/${BRANCH}:${CURRENT_PREVIEW_SHA}"
          else
            PREVIEW_LEASE="--force-with-lease=refs/heads/${BRANCH}:"
          fi

          git push --atomic \
            --force-with-lease="refs/heads/${BASE_BRANCH}:${BASE_SHA}" \
            --force-with-lease="refs/heads/${ANCHOR_BRANCH}:${ANCHOR_SHA}" \
            "${PREVIEW_LEASE}" \
            origin \
            "${BASE_SHA}:refs/heads/${BASE_BRANCH}" \
            "${ANCHOR_SHA}:refs/heads/${ANCHOR_BRANCH}" \
            "${BRANCH}:refs/heads/${BRANCH}"

      - name: Create or update preview pull request
        if: ${{ steps.replay.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG_SHA: ${{ steps.state.outputs.tag_sha }}
          EFFECTIVE_BASE_SHA: ${{ steps.state.outputs.effective_base_sha }}
          VERSION_SYNC_SHA: ${{ steps.state.outputs.version_sync_sha }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          ANCHOR_SHA: ${{ steps.state.outputs.anchor_sha }}
          HEAD_SHA: ${{ steps.replay.outputs.head_sha }}
          PATCH_COUNT: ${{ steps.replay.outputs.patch_count }}
        run: |
          set -euo pipefail

          BODY_FILE="$(mktemp)"
          MARKER_JSON="$(jq -nc \
            --arg tag "${TAG}" \
            --arg base_sha "${BASE_SHA}" \
            --arg anchor_sha "${ANCHOR_SHA}" \
            --arg effective_base_sha "${EFFECTIVE_BASE_SHA}" \
            --arg head_sha "${HEAD_SHA}" \
            '{
              version: 1,
              tag: $tag,
              base_sha: $base_sha,
              anchor_sha: $anchor_sha,
              effective_base_sha: $effective_base_sha,
              head_sha: $head_sha
            }')"
          {
            echo "Clean upstream release preview for \`${TAG}\`."
            echo
            echo "This PR is generated from:"
            echo "- upstream release tag: \`${TAG}\` (\`${TAG_SHA}\`)"
            echo "- effective upstream baseline: \`${EFFECTIVE_BASE_SHA}\`"
            if [ -n "${VERSION_SYNC_SHA}" ]; then
              echo "- upstream VERSION sync commit: \`${VERSION_SYNC_SHA}\`"
            fi
            echo "- previous upstream baseline: \`${ANCHOR_BRANCH}\` (\`${ANCHOR_SHA}\`)"
            echo "- current production fork: \`${BASE_BRANCH}\` (\`${BASE_SHA}\`)"
            echo "- replayed fork patch count: \`${PATCH_COUNT}\`"
            echo "- generated fork head: \`${HEAD_SHA}\`"
            echo
            echo "Review the diff from current \`${BASE_BRANCH}\` to this generated branch."
            echo
            echo "**Do not use the GitHub merge button.**"
            echo
            echo "After reviewing the diff and checks, comment \`/promote-fork\`. The promote workflow will force-with-lease rewrite \`${BASE_BRANCH}\`, move \`${ANCHOR_BRANCH}\` to the effective upstream baseline, close this PR, and delete \`${BRANCH}\`."
            echo
            echo "<!-- fork-sync-source ${MARKER_JSON} -->"
          } > "${BODY_FILE}"

          PR_NUMBER="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore: preview upstream ${TAG} on fork" \
              --body-file "${BODY_FILE}"
            gh pr ready "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --undo || true
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --draft \
              --title "chore: preview upstream ${TAG} on fork" \
              --body-file "${BODY_FILE}"
          fi

      - name: Dispatch preview checks
        if: ${{ steps.replay.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail

          gh workflow run "CI" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BRANCH}"
          gh workflow run "Security Scan" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BRANCH}"

      - name: Close resolved or stale conflict issue
        if: ${{ steps.state.outputs.already_current == 'true' || steps.preview.outputs.active == 'true' || steps.replay.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ALREADY_CURRENT: ${{ steps.state.outputs.already_current }}
          ACTIVE_PREVIEW: ${{ steps.preview.outputs.active }}
          PREVIEW_PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ "${ALREADY_CURRENT}" = "true" ]; then
            CLOSE_COMMENT="Upstream ${TAG} is already the promoted baseline; closing this stale conflict report."
          elif [ "${ACTIVE_PREVIEW}" = "true" ]; then
            CLOSE_COMMENT="A current clean preview is already available in PR #${PREVIEW_PR_NUMBER}; closing this resolved conflict report."
          else
            CLOSE_COMMENT="Automated sync for ${TAG} completed successfully; closing the previous conflict report."
          fi

          gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "${CONFLICT_ISSUE_LABEL}" \
            --state open \
            --json number,title |
          jq -r --arg title "Upstream sync conflict: ${TAG}" \
            '.[] | select(.title == $title) | .number' |
          while IFS= read -r ISSUE_NUMBER; do
            if [ -z "${ISSUE_NUMBER}" ]; then
              continue
            fi

            gh issue close "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "${CLOSE_COMMENT}"
          done
